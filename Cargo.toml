[package]
name = "crossport"
version = "0.2.0"
edition = "2024"
authors = ["mt <nico.as.nicos@gmail.com>"]
description = "Cross-platform port helper CLI (skeleton)"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
dirs = "7.0"
sysinfo = "0.39"
nix = { version = "0.31", features = ["signal", "user"] }
colored = "3.1"
regex = "1.10"
once_cell = "1.19"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
