# Copy to ./crossport.toml, or use --config config/crossport.example.toml.
# Only settings currently used by the CLI are included.
[scan]
default_range = "3000-9999"

[kill]
confirm = true
# Optional: send only INT, TERM or KILL (Unix).
# Leave unset to use the staged INT -> TERM -> KILL strategy.
# default_signal = "TERM"

# TUI stop confirmation and staged termination do not use [kill] settings.
# ui.color, backend.strategy and output.* do not currently affect behavior.
