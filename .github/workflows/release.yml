name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    validate-version:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Check tag matches package version
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  python3 - <<'PYTHON'
                  import os, tomllib
                  with open("Cargo.toml", "rb") as source:
                      version = tomllib.load(source)["package"]["version"]
                  if os.environ["RELEASE_TAG"] != f"v{version}":
                      raise SystemExit("Release tag must match Cargo.toml version")
                  PYTHON

    build-and-release:
        needs: validate-version
        name: Build and Release
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      artifact_name: crossport-linux-amd64
                      asset_name: crossport-linux-amd64
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      artifact_name: crossport-macos-amd64
                      asset_name: crossport-macos-amd64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      artifact_name: crossport-macos-arm64
                      asset_name: crossport-macos-arm64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      artifact_name: crossport-windows-amd64.exe
                      asset_name: crossport-windows-amd64.exe

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: dtolnay/rust-toolchain@1.98.1
              with:
                  targets: ${{ matrix.target }}

            - name: Build
              run: cargo build --locked --release --target ${{ matrix.target }}

            - name: Rename Binary (Unix)
              if: matrix.os != 'windows-latest'
              run: mv target/${{ matrix.target }}/release/crossport ${{ matrix.artifact_name }}

            - name: Rename Binary (Windows)
              if: matrix.os == 'windows-latest'
              run: move target/${{ matrix.target }}/release/crossport.exe ${{ matrix.artifact_name }}

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: ${{ matrix.artifact_name }}

    create-release:
        needs: build-and-release
        runs-on: ubuntu-latest
        steps:
            - name: Download Artifacts
              uses: actions/download-artifact@v4

              with:
                  merge-multiple: true

            - name: Generate checksums
              run: sha256sum crossport-* > SHA256SUMS

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: |
                      crossport-*
                      SHA256SUMS
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
